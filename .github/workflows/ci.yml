name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E release candidate
        run: npm run test:e2e

  api:
    name: API checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Typecheck
        run: python -m mypy config

      - name: Django checks
        run: python manage.py check

      - name: OpenAPI contract
        run: |
          python manage.py spectacular --file ../../docs/api/openapi.yaml --validate
          git diff --exit-code -- ../../docs/api/openapi.yaml

      - name: Tests
        run: python -m pytest --cov=apps --cov-report=term-missing --cov-fail-under=80

  infrastructure:
    name: Infrastructure checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for schema in Path("packages/schemas").rglob("*.json"):
              with schema.open(encoding="utf-8") as stream:
                  json.load(stream)
          PY

      - name: Validate Compose
        run: docker compose --env-file .env.example -f compose.yaml -f compose.dev.yaml config