services:
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      target: development
    command: npm run dev
    ports:
      - "${WEB_PORT:-10700}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(() => process.exit(0)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "${API_PORT:-10701}:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-key}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD:-taskflow}@db:5432/${POSTGRES_DB:-taskflow}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ACCOUNTS_BASE_URL: ${ACCOUNTS_BASE_URL:-https://cuenta.carlosrevert.es}
      ACCOUNTS_TIMEOUT_SECONDS: ${ACCOUNTS_TIMEOUT_SECONDS:-2}
      ACCOUNTS_APPLICATION_SLUG: ${ACCOUNTS_APPLICATION_SLUG:-taskflow}
      ACCOUNTS_QUOTA_MODE: ${ACCOUNTS_QUOTA_MODE:-accounts}
      ACCOUNTS_TASKFLOW_SERVICE_KEY: ${ACCOUNTS_TASKFLOW_SERVICE_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      AI_STT_PROVIDER: ${AI_STT_PROVIDER:-}
      AI_LLM_PROVIDER: ${AI_LLM_PROVIDER:-}
      AI_LLM_MAX_RETRIES: ${AI_LLM_MAX_RETRIES:-1}
      AI_MAX_LLM_RESPONSE_CHARS: ${AI_MAX_LLM_RESPONSE_CHARS:-20000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./apps/api:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-10710}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-10720}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: celery -A config.celery:app worker --loglevel=INFO --concurrency=1
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD:-taskflow}@db:5432/${POSTGRES_DB:-taskflow}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ACCOUNTS_APPLICATION_SLUG: ${ACCOUNTS_APPLICATION_SLUG:-taskflow}
      ACCOUNTS_QUOTA_MODE: ${ACCOUNTS_QUOTA_MODE:-accounts}
      ACCOUNTS_TASKFLOW_SERVICE_KEY: ${ACCOUNTS_TASKFLOW_SERVICE_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      AI_STT_PROVIDER: ${AI_STT_PROVIDER:-}
      AI_LLM_PROVIDER: ${AI_LLM_PROVIDER:-}
      AI_LLM_MAX_RETRIES: ${AI_LLM_MAX_RETRIES:-1}
      AI_MAX_LLM_RESPONSE_CHARS: ${AI_MAX_LLM_RESPONSE_CHARS:-20000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./apps/api:/app
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config.celery:app inspect ping --timeout=2 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  web_node_modules:
  web_next: